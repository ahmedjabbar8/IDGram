name: Build and Publish IDGram Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --continue

      - name: Create Public Release with Direct APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "IDGram v1.0.0"
          body: |
            📱 **تطبيق IDGram النسخة المباشرة**
            - رفع القصص بدقة 4K و 60 فريم (60 FPS).
            - حفظ الصور والفيديوهات المؤقتة والقصص.
            - واجهة كاملة باللغة العربية الفصحى.
          files: TMessagesProj/build/outputs/apk/debug/*.apk
